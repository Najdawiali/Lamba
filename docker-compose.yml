version: "3.9"

services:
  postgres:
    build:
      context: ./backend
      dockerfile: Dockerfile.postgres
    container_name: eagle_postgres
    environment:
      POSTGRES_USER: eagle
      POSTGRES_PASSWORD: eagle_secret
      POSTGRES_DB: eagle_vision
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eagle -d eagle_vision"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eagle_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
